<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pop Theory studio</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c0c0c; overflow: hidden; }
  #frame { position: relative; overflow: hidden; color: #f2f2f2; font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #2a2a28 0%, #161616 45%, #0d0d0d 100%); }
  .beam { position: absolute; top: 0; height: 75%; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,250,225,0.10) 0%, rgba(255,250,225,0.03) 40%, rgba(0,0,0,0) 70%); }
  .lamp { position: absolute; top: 0; width: 140px; height: 26px; background: #c9c7bd;
    clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%); box-shadow: 0 0 40px #fff8; }
  .brand { position: absolute; font-weight: 800; letter-spacing: 0.04em; }
  .tbox { position: absolute; background: #0a0a0a; border: 2px solid #2b2b2b; border-radius: 14px; text-align: right; }
  .tbox .kick, .sbox .kick { font-family: Consolas, monospace; color: #9a9a9a; letter-spacing: 0.22em; text-transform: uppercase; }
  .tbox .big { font-family: "Segoe UI Black", "Arial Black", sans-serif; line-height: 1.05; }
  .tbox .sub { font-family: Consolas, monospace; color: #f2b632; }
  .sbox { position: absolute; background: #0a0a0a; border: 2px solid #2b2b2b; border-radius: 14px; }
  .sbox .val { font-family: "Segoe UI Black", "Arial Black", sans-serif; }
  .stage { position: absolute; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .text { position: absolute; }
  .label { font-family: Consolas, monospace; color: #f2b632; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
  .title { font-family: "Segoe UI Black", "Arial Black", sans-serif; text-transform: uppercase; line-height: 0.98; }
  .body { color: #c9c9c9; line-height: 1.3; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(13,13,13,0) 0%, rgba(13,13,13,0.94) 30%, #0d0d0d 100%); }
  .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: #f2b632; }
</style>
</head>
<body>
<div id="frame"></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="comps.js"></script>
<script>
  // assets and footage manifests are written by the build (prep_assets.py,
  // render.py); load them from the build folder
  for (const f of ["assets/data.js", "footage/manifest.js", "vo/durations.js"]) document.write(`<script src="${BUILD}${f}"><\/script>`);
</script>
<script>
finalizeComp();
const frame = document.getElementById("frame");
frame.style.width = COMP.w + "px";
frame.style.height = COMP.h + "px";
const svgDefs = `<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
  <path d="M0 0 L10 5 L0 10 z" fill="${C.amber}"/></marker></defs>`;

// fade between scenes: the last/first 0.3 s of each scene
const XF = 0.3;

function sceneAt(t) {
  const list = COMP.scenes;
  for (let i = 0; i < list.length; i++) if (t < list[i].t0 + list[i].d || i === list.length - 1) return list[i];
}

function render(t) {
  window.FOOTAGE_FRAMES = window.FOOTAGE_FRAMES || {};
  const s = sceneAt(t), local = t - s.t0;
  const u = local + (s.from || 0);     // a scene may start part-way into its animation or clip
  const wide = COMP.layout === "wide";
  const W_ = COMP.w, H_ = COMP.h;
  const fadeIn = clamp(local / XF), fadeOut = clamp((s.d - local) / XF);
  const vis = Math.min(fadeIn, fadeOut);
  const cap = captionAt(s, local);
  let art = "";
  try { art = SCENES[s.kind](u, s); } catch (e) { art = `<text x="40" y="80" fill="red" font-size="40">${esc(e.message)}</text>`; }
  // geometry of the parts, per layout
  const g = wide
    ? { brand: [70, 52, 30], box: [W_ - 70, 40, 380], stat: [70, 110, 300], stage: [700, 190, 1150, 719],
        text: [70, 360, 580], lab: 24, title: 72, body: 32 }
    : { brand: [48, 70, 30], box: [W_ - 48, 52, 520], stat: [48, 130, 360], stage: [0, 330, 1080, 675],
        text: [56, 1230, 968], lab: 30, title: 116, body: 42 };
  const [sx, sy, sw, sh] = g.stage;
  const box = s.box ? `<div class="tbox" style="right:${W_ - g.box[0]}px;top:${g.box[1]}px;padding:${wide ? "16px 26px" : "18px 30px"};min-width:${wide ? 260 : 330}px">
      ${s.box.kicker ? `<div class="kick" style="font-size:${wide ? 16 : 20}px">${esc(s.box.kicker)}</div>` : ""}
      <div class="big" style="font-size:${wide ? 54 : 64}px">${esc(s.box.big)}</div>
      ${s.box.sub ? `<div class="sub" style="font-size:${wide ? 18 : 22}px">${esc(s.box.sub)}</div>` : ""}</div>` : "";
  const stat = s.stat ? `<div class="sbox" style="left:${g.stat[0]}px;top:${g.stat[1]}px;padding:14px 22px">
      <div class="kick" style="font-size:${wide ? 15 : 18}px">${esc(s.stat.label)}</div>
      <div class="val" style="font-size:${wide ? 48 : 56}px;color:${C.amber}">${esc(s.stat.value)}</div></div>` : "";
  const titleSize = s.title.length > 18 ? g.title * (wide ? 0.82 : 0.86) : g.title;
  const textTop = wide ? (s.stat ? 380 : 330) : g.text[1];
  const text = `<div class="text" style="left:${g.text[0]}px;top:${textTop}px;width:${g.text[2]}px">
      <div class="label" style="font-size:${g.lab}px;opacity:${ramp(local, 0.1, 0.4)}">${esc(s.label || "")}</div>
      <div class="title" style="font-size:${titleSize}px;margin-top:${wide ? 14 : 18}px;opacity:${ramp(local, 0.2, 0.4)};transform:translateY(${(1 - ramp(local, 0.2, 0.4)) * 24}px)">${esc(s.title || "")}</div>
      <div class="body" style="font-size:${g.body}px;margin-top:${wide ? 26 : 30}px;opacity:${cap.u}">${esc(cap.text)}</div></div>`;
  frame.innerHTML = lamp(W_) +
    `<div class="brand" style="left:${g.brand[0]}px;top:${g.brand[1]}px;font-size:${g.brand[2]}px">${BRAND}</div>` + stat + box +
    `<div class="stage" style="left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;opacity:${vis}">
       <svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">${svgDefs}${art}</svg></div>` +
    (wide ? "" : `<div class="fade" style="top:${g.text[1] - 120}px"></div>`) + text +
    `<div class="progress" style="width:${(t / COMP.duration) * 100}%"></div>`;
  frame.style.opacity = Math.min(clamp(t / 0.4), clamp((COMP.duration - t) / 0.6));
  return [...frame.querySelectorAll("image")].map((i) => i.getAttribute("href"));
}
window.render = render;
if (!P.get("frozen")) {   // preview in a normal browser: play in real time
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % COMP.duration); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
